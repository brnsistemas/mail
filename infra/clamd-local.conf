# Local QA: preloaded official signatures. Production needs daily updates and sizing.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 1
MaxQueue 3
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 40M
MaxRecursion 10
MaxFiles 1000
ReadTimeout 20
CommandReadTimeout 10
ConcurrentDatabaseReload no
SelfCheck 0
LogTime yes
LogClean no
LogVerbose no
AlertExceedsMax yes
